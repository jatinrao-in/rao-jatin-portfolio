<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to WhatsApp - Rao Jatin</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background-color: #f1f5f9;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      max-width: 460px;
      width: 100%;
      text-align: center;
      border-top: 4px solid #25D366;
    }

    h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 20px;
    }

    .msg-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      color: #1e293b;
      margin-bottom: 24px;
      text-align: left;
    }

    .msg-box strong {
      display: block;
      color: #64748b;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .btn {
      display: inline-block;
      background-color: #25D366;
      color: #ffffff;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 15px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #1da851;
    }

    .countdown-text {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 20px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Wait, we are redirecting you...</h2>
    <p>Connecting you directly to <strong>Rao Jatin</strong> on WhatsApp.</p>

    <div class="msg-box">
      <strong>Pre-filled Message:</strong>
      "Hey Rao Jatin, I need a website for my business."
    </div>

    <a id="wa-link" href="#" class="btn">Click Here to Open WhatsApp</a>

    <p class="countdown-text">Redirecting automatically in <span id="sec">3</span> seconds...</p>
  </div>

  <script>
    const phone = "919306018924";
    const text = encodeURIComponent("Hey Rao Jatin, I need a website for my business.");
    const url = `https://wa.me/${phone}?text=${text}`;

    document.getElementById("wa-link").href = url;

    let seconds = 3;
    const secEl = document.getElementById("sec");

    const timer = setInterval(() => {
      seconds--;
      if (secEl) secEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = url;
      }
    }, 1000);
  </script>

</body>
</html>
